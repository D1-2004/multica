<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" width="1080" height="880">
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#111827} .sub{fill:#4b5563}</style>
<rect width="1080" height="880" fill="white"/>
