# Shared across nginx workers, scoped to this replica. Empty keys are not limited.
map $http_user_agent $multica_scan_key {
    default "";
    ~*Alibaba\.Security\.Heimdall "scanner";
}
limit_req_zone $multica_scan_key zone=multica_scan_rate:1m rate=1r/s;
limit_conn_zone $multica_scan_key zone=multica_scan_connections:1m;
limit_conn_zone $server_name zone=multica_frontend_connections:1m;

server {
    listen 80 default_server;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Web-Server-Type nginx;
    proxy_set_header WL-Proxy-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffers 128 8k;
    proxy_intercept_errors on;

    location = /status.taobao {
        proxy_pass http://127.0.0.1:6001/check.node;
    }

    location = /check.node {
        proxy_pass http://127.0.0.1:6001/check.node;
    }

    location = /health {
        proxy_pass http://127.0.0.1:6001/check.node;
    }

    # The daemon's task-wakeup socket. It lives under /api/, but the generic
    # /api/ block below must NOT forward the upgrade headers (every plain REST
    # call would then carry a bogus Connection: upgrade and lose keepalive), so
    # it gets its own exact-match location — which nginx matches ahead of the
    # /api/ prefix. Without this the handshake fails with "'upgrade' token not
    # found in 'Connection' header", the daemon silently falls back to its
    # 30s poll, and every task waits up to a full poll interval to be claimed.
    location = /api/daemon/ws {
        proxy_pass http://127.0.0.1:8080/api/daemon/ws;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Local Runner machines also keep an outbound WebSocket pinned to the API
    # replica that accepted the signed challenge. Keep this exact location out
    # of the generic REST block so nginx preserves the protocol upgrade.
    location = /api/runner/ws {
        proxy_pass http://127.0.0.1:8080/api/runner/ws;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Site archives are raw ZIP request bodies, not MCP JSON or multipart.
    # Disable request buffering so the backend can enforce its own streaming
    # length/hash contract without nginx first materializing the whole upload.
    location /api/sitehosting/uploads/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8080;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/dsh-native/ui/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Connection URLs contain bearer secrets. Do not persist their request URI.
    location ~ ^/api/mcp/workspaces/[^/]+/connect/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # One backend-owned policy selects the environment for pages and APIs.
    location /forward/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # OAuth query strings contain one-use credentials and state tokens.
    location ~ ^/api/(connectors/oauth/callback|connector-oauth/callback|github/authorize)$ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /auth/callback {
        # Bound frontend work; never apply these limits to API/daemon streams.
        limit_req zone=multica_scan_rate burst=2 nodelay;
        limit_req_status 429;
        limit_conn multica_scan_connections 2;
        limit_conn multica_frontend_connections 64;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # Public-unlisted Agent static Sites are served by the Go backend from the
    # active revision in object storage. Keep this ahead of the frontend catch-
    # all so /sites/<publicSiteId>/ never resolves as a Next.js workspace path.
    location /sites/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Immutable assets do not invoke React rendering.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
    }

    # The gateway strips /forward/{target}; protect the target page too.
    location = /dingtalk/configure {
        access_log off;
        error_log /dev/null crit;
        limit_req zone=multica_scan_rate burst=2 nodelay;
        limit_req_status 429;
        limit_conn multica_scan_connections 2;
        limit_conn multica_frontend_connections 64;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        # Bound frontend work; never apply these limits to API/daemon streams.
        limit_req zone=multica_scan_rate burst=2 nodelay;
        limit_req_status 429;
        limit_conn multica_scan_connections 2;
        limit_conn multica_frontend_connections 64;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
